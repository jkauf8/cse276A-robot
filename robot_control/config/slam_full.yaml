# Settings for slam_control (HW3). Paths: hw3_square.txt and hw3_octagon.txt, 3 loops each, relative to the start pose.
# World frame: origin = where the robot starts, x = its initial facing, y = left. The tag map is not given: it is built while driving.
/**:
  ros__parameters:
    # ---- camera mount in the vehicle frame (x forward, y left, z up, m), pitch down in degrees ----
    camera:
      x: 0.085
      y: 0.0
      z: 0.125
      pitch_deg: 0.0
    camera_frame: camera_frame   # frame name on the camera images
    tag_frame_prefix: tag_       # tag frames are tag_<id>, as in apriltag_hw3.yaml

    # ---- mission ----
    waypoints_file: ''           # '' = installed config/hw3_square.txt (slam_launch.py sets it)
    max_blind_time: 30.0         # stop after this many s with no tag
    start_delay: 1.0             # s of zero commands before moving
    rate: 20.0

    # ---- controller (same values as HW2) ----
    min_cmd: 0.30                # smallest wheel command while moving (lower values stalled)
    deadband: 0.10               # wheel commands below this do nothing
    turn_tol_deg: 2.0
    reaim_tol_deg: 5.0
    pos_tol: 0.03
    final_checks: 2              # heading re-checks after the last turn

    # ---- new landmarks ----
    init_count: 3                # a tag joins the map after this many detections that agree
    init_spread: 0.30            # they agree if each landmark guess is within this distance of their mean (m)
    # log_dir: /home/ubuntu/hw3_logs   # where the CSV logs go (default ~/hw3_logs)
