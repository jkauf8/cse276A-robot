# Settings for apriltag_node (used by tag_detection_launch.py). The launch argument tag_size overrides size.
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.15                  # tag edge (black square) in meters
    max_hamming: 1
    pose_estimation_method: "pnp"
    detector:
      threads: 4
      decimate: 2.0
      blur: 0.0
      refine: True
      sharpening: 0.4
      debug: False
    tag:                        # only tags listed in frames are published
      ids: [0, 1, 2, 3, 4, 5]
      frames: [tag_0, tag_1, tag_2, tag_3, tag_4, tag_5]
