# Settings for localization_control. Route (hw2_waypoints.txt): (0,0,0) -> (1,0,0) -> (1,2,pi) -> (0,0,0).
# All coordinates are in the world frame: origin = where the robot starts, x = its initial facing, y = left.
/**:
  ros__parameters:
    # ---- tag map ----
    # Position of each tag center, measured from the start pose: x ahead, y left, z height, yaw = direction the tag faces
    # (yaw is not used by the filter).
    # Use decimal points everywhere (2.0, not 2), and keep all five lists the same length.
    tags:
      ids: [0, 1, 2, 3, 4]
      x: [2.0, 1.5, 0.5, 0.0, -0.5]
      y: [0.0, 3.0, 3.0, 2.0, -0.5]
      z: [0.12, 0.12, 0.12, 0.12, 0.12]
      yaw: [3.14159, -2.0344, -1.1071, 0.0, 0.7854]

    # ---- camera mount in the vehicle frame (x forward, y left, z up, m), pitch down in degrees ----
    camera:
      x: 0.085
      y: 0.0
      z: 0.125
      pitch_deg: 0.0
    camera_frame: camera_frame   # frame name on the camera images
    tag_frame_prefix: tag_       # tag frames are tag_<id>, as in apriltag_hw2.yaml

    # ---- mission ----
    waypoints_file: ''           # '' = installed config/hw2_waypoints.txt
    max_blind_time: 20.0         # stop after this many s with no tag
    start_delay: 1.0             # s of zero commands before moving
    rate: 20.0

    # ---- controller ----
    min_cmd: 0.30                # smallest wheel command while moving (lower values stalled)
    deadband: 0.10               # wheel commands below this do nothing
    turn_tol_deg: 2.0
    reaim_tol_deg: 5.0
    pos_tol: 0.03
    final_checks: 2              # heading re-checks after the last turn
    # log_dir: /home/ubuntu/hw2_logs   # where the CSV log goes (default ~/hw2_logs)
